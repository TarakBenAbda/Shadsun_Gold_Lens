; =============================================================================
; Shadsun Gold Lens — configuration de l'outil sgl_prix_api.py
; Auteur : Tarak Ben Abda – novembre 2026
; Copiez ce fichier en « sgl_prix_api.ini » puis remplissez-le (GUIDE-API.md).
; Ne partagez jamais votre client_secret.
; =============================================================================

[battlenet]
; Identifiants de votre client API (develop.battle.net > API Access)
client_id =
client_secret =

[marche]
; Région de votre compte : eu ou us
region = eu
; Type de serveur, pour l'affichage en jeu : PvP, Normal, JdR, JdR JcJ
type_serveur = PvP
; HDV de votre marché : remplis automatiquement par « identifier »
hdv_alliance =
hdv_horde =
hdv_neutre =
; Prix des annonces : auto, total (prix du lot entier) ou unite
prix_annonce = auto

[wow]
; Dossier Interface\AddOns de WoW Forever (exemple ci-dessous, à adapter)
addons = C:\Program Files (x86)\World of Warcraft\_forever_\Interface\AddOns
; Fichier de sauvegarde de l'add-on (pour « identifier ») ; remplacez VOTRE_COMPTE
savedvariables = C:\Program Files (x86)\World of Warcraft\_forever_\WTF\Account\VOTRE_COMPTE\SavedVariables\ShadsunGoldLens.lua
; Nom du serveur affiché par /sgl diag (facultatif : sinon le plus fourni)
serveur =

[outil]
; Réutiliser un téléchargement récent (minutes)
cache_minutes = 50
; Mise à jour horaire : minutes entre deux mises à jour (30 au minimum)
intervalle_minutes = 60
dossier_cache = cache
